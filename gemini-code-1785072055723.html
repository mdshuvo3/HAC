<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Audio Controller</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .container { background-color: var(--card-bg); width: 100%; max-width: 420px; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #64748b; display: inline-block; margin-right: 6px; }
    .dot.connected { background-color: #10b981; }

    .track-info { text-align: center; margin-bottom: 1.5rem; }
    .track-title { font-size: 1.25rem; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 0.25rem; }
    .track-status { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .btn { background-color: #334155; border: none; color: var(--text); width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn:active { transform: scale(0.95); }
    .btn-main { background-color: var(--accent); width: 64px; height: 64px; }
    .btn svg { fill: currentColor; }

    .slider-group { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .slider-group svg { fill: var(--text-muted); flex-shrink: 0; }
    input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }

    .live-call-section { border-top: 1px solid #334155; padding-top: 1.25rem; text-align: center; }
    .btn-call { background-color: #334155; width: 100%; border-radius: 0.75rem; padding: 0.75rem; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-call.active { background-color: var(--accent-danger); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Status Bar -->
  <div class="status-bar">
    <div><span id="status-dot" class="dot"></span><span id="status-text">Connecting...</span></div>
    <div id="mode-badge">Music Mode</div>
  </div>

  <!-- Track Information -->
  <div class="track-info">
    <div id="song-title" class="track-title">No Track Selected</div>
    <div id="play-status" class="track-status">Stopped</div>
  </div>

  <!-- Media Controls -->
  <div class="controls">
    <button class="btn" onclick="sendCmd('prev')" title="Previous/Rewind">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="btn btn-main" id="play-btn" onclick="togglePlay()" title="Play/Pause">
      <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn" onclick="sendCmd('next')" title="Next/Forward">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>

  <!-- Volume Slider -->
  <div class="slider-group">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" id="volume-slider" min="0" max="100" value="70" oninput="setVolume(this.value)">
    <span id="vol-val" style="width: 32px; font-size: 0.85rem; color: var(--text-muted)">70%</span>
  </div>

  <!-- Live Microphone Call Section -->
  <div class="live-call-section">
    <button id="call-btn" class="btn btn-call" onclick="toggleCall()">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      <span id="call-text">Start Live Mic Call</span>
    </button>
  </div>
</div>

<script>
  // WebSocket setup pointing to the ESP32 IP
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  let isPlaying = false;
  let isCalling = false;
  let audioContext = null;
  let mediaStream = null;
  let scriptNode = null;

  // Icons
  const playIcon = '<path d="M8 5v14l11-7z"/>';
  const pauseIcon = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  ws.onopen = () => {
    document.getElementById('status-dot').classList.add('connected');
    document.getElementById('status-text').innerText = 'Connected';
  };

  ws.onclose = () => {
    document.getElementById('status-dot').classList.remove('connected');
    document.getElementById('status-text').innerText = 'Disconnected';
  };

  // Receive metadata updates from ESP32
  ws.onmessage = (event) => {
    if (typeof event.data === "string") {
      try {
        const msg = JSON.parse(event.data);
        if (msg.title) document.getElementById('song-title').innerText = msg.title;
        if (msg.playing !== undefined) {
          isPlaying = msg.playing;
          document.getElementById('play-icon').innerHTML = isPlaying ? pauseIcon : playIcon;
          document.getElementById('play-status').innerText = isPlaying ? 'Playing' : 'Paused';
        }
        if (msg.volume !== undefined) {
          document.getElementById('volume-slider').value = msg.volume;
          document.getElementById('vol-val').innerText = msg.volume + '%';
        }
      } catch(e) {}
    }
  };

  function sendCmd(action, value = null) {
    if (ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action: action, value: value }));
    }
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('play-icon').innerHTML = isPlaying ? pauseIcon : playIcon;
    document.getElementById('play-status').innerText = isPlaying ? 'Playing' : 'Paused';
    sendCmd(isPlaying ? 'play' : 'pause');
  }

  function setVolume(val) {
    document.getElementById('vol-val').innerText = val + '%';
    sendCmd('volume', parseInt(val));
  }

  // --- Live Microphone Streaming Logic ---
  async function toggleCall() {
    if (!isCalling) {
      try {
        // Request raw mic audio
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        
        // 16kHz sample rate works efficiently with ESP32 PCM processing
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        const source = audioContext.createMediaStreamSource(mediaStream);
        
        // Create script processor to extract raw audio samples
        scriptNode = audioContext.createScriptProcessor(2048, 1, 1);
        
        scriptNode.onaudioprocess = (e) => {
          if (!isCalling || ws.readyState !== WebSocket.OPEN) return;
          
          const float32Data = e.inputBuffer.getChannelData(0);
          // Convert 32-bit Float PCM to 16-bit Int PCM for ESP32 DAC/I2S
          const int16Data = new Int16Array(float32Data.length);
          for (let i = 0; i < float32Data.length; i++) {
            let s = Math.max(-1, Math.min(1, float32Data[i]));
            int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
          }
          
          // Send raw binary PCM over WebSocket
          ws.send(int16Data.buffer);
        };

        source.connect(scriptNode);
        scriptNode.connect(audioContext.destination);

        isCalling = true;
        document.getElementById('call-btn').classList.add('active');
        document.getElementById('call-text').innerText = 'End Live Call';
        document.getElementById('mode-badge').innerText = 'Live Call Active';
        sendCmd('mode', 'mic');

      } catch (err) {
        alert('Microphone access denied or unsupported browser.');
        console.error(err);
      }
    } else {
      // Stop microphone stream
      if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
      if (audioContext) audioContext.close();
      
      isCalling = false;
      document.getElementById('call-btn').classList.remove('active');
      document.getElementById('call-text').innerText = 'Start Live Mic Call';
      document.getElementById('mode-badge').innerText = 'Music Mode';
      sendCmd('mode', 'music');
    }
  }
</script>
</body>
</html>
