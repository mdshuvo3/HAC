<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Audio Controller</title>
  <!-- Load MQTT Client over CDN -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .container { background-color: var(--card-bg); width: 100%; max-width: 420px; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; font-size: 0.875rem; color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #64748b; display: inline-block; margin-right: 6px; }
    .dot.connected { background-color: #10b981; }

    .search-box { margin-bottom: 1.25rem; }
    input[type="text"] { width: 100%; padding: 0.8rem; border-radius: 0.75rem; border: 1px solid #334155; background: #0f172a; color: var(--text); font-size: 0.95rem; margin-bottom: 0.5rem; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }

    .track-info { text-align: center; margin-bottom: 1.25rem; }
    .track-title { font-size: 1.15rem; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 0.25rem; }
    .track-status { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .btn { background-color: #334155; border: none; color: var(--text); width: 48px; height: 48px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn:active { transform: scale(0.95); }
    .btn-main { background-color: var(--accent); width: 60px; height: 60px; }
    .btn-submit { width: 100%; border-radius: 0.75rem; height: 44px; font-weight: bold; background: var(--accent); }

    .slider-group { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; }
    input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }

    .live-call-section { border-top: 1px solid #334155; padding-top: 1.25rem; text-align: center; }
    .btn-call { background-color: #334155; width: 100%; border-radius: 0.75rem; height: 48px; font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-call.active { background-color: var(--accent-danger); animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Status Bar -->
  <div class="status-bar">
    <div><span id="status-dot" class="dot"></span><span id="status-text">Connecting MQTT...</span></div>
    <div id="mode-badge">Music Mode</div>
  </div>

  <!-- Track Information -->
  <div class="track-info">
    <div id="song-title" class="track-title">No Track Selected</div>
    <div id="play-status" class="track-status">Stopped</div>
  </div>

  <!-- Song URL / Search Field -->
  <div class="search-box">
    <input type="text" id="songQuery" placeholder="Paste YouTube link or song name...">
    <button class="btn btn-submit" onclick="playSong()">Play Track</button>
  </div>

  <!-- Playback Controls -->
  <div class="controls">
    <button class="btn" onclick="sendCmd('prev')" title="Previous">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="btn btn-main" id="play-btn" onclick="togglePlay()" title="Play/Pause">
      <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn" onclick="sendCmd('next')" title="Next">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>

  <!-- Volume Control -->
  <div class="slider-group">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#94a3b8"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <input type="range" id="volume-slider" min="0" max="100" value="70" onchange="setVolume(this.value)">
    <span id="vol-val" style="width: 32px; font-size: 0.85rem; color: var(--text-muted)">70%</span>
  </div>

  <!-- Live Microphone Section -->
  <div class="live-call-section">
    <button id="call-btn" class="btn btn-call" onclick="toggleCall()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      <span id="call-text">Start Live Mic Call</span>
    </button>
  </div>
</div>

<script>
  const mqttTopic = "my_client_home_system_1234/command";
  const pipedApi = "https://pipedapi.kavin.rocks";
  
  // Connect via secure Cloud MQTT over WebSockets
  const client = mqtt.connect('wss://broker.hivemq.com:8000/mqtt');

  let isPlaying = false;
  let isCalling = false;
  let mediaRecorder = null;
  let audioChunks = [];

  const playIcon = '<path d="M8 5v14l11-7z"/>';
  const pauseIcon = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

  client.on('connect', () => {
    document.getElementById('status-dot').classList.add('connected');
    document.getElementById('status-text').innerText = 'Cloud Connected';
  });

  client.on('offline', () => {
    document.getElementById('status-dot').classList.remove('connected');
    document.getElementById('status-text').innerText = 'Offline';
  });

  function sendCmd(action, value = null) {
    const payload = JSON.stringify({ action: action, value: value });
    client.publish(mqttTopic, payload);
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    document.getElementById('play-icon').innerHTML = isPlaying ? pauseIcon : playIcon;
    document.getElementById('play-status').innerText = isPlaying ? 'Playing' : 'Paused';
    sendCmd(isPlaying ? 'resume' : 'pause');
  }

  function setVolume(val) {
    document.getElementById('vol-val').innerText = val + '%';
    sendCmd('volume', parseInt(val));
  }

  function extractVideoId(input) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
    const match = input.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  async function playSong() {
    const input = document.getElementById('songQuery').value.trim();
    if (!input) return alert("Enter a song name or paste a YouTube URL!");

    document.getElementById('play-status').innerText = "Resolving track...";
    let videoId = extractVideoId(input);

    try {
      if (!videoId) {
        let res = await fetch(`${pipedApi}/search?q=${encodeURIComponent(input)}&filter=music_songs`);
        let data = await res.json();
        if (!data.items || data.items.length === 0) return alert("No song found.");
        videoId = data.items[0].url.split("v=")[1];
      }

      let streamRes = await fetch(`${pipedApi}/streams/${videoId}`);
      let streamData = await streamRes.json();

      let m4aStreams = streamData.audioStreams.filter(s => s.format === "M4A" || s.mimeType.includes("audio/mp4"));
      let targetStreams = m4aStreams.length > 0 ? m4aStreams : streamData.audioStreams;
      targetStreams.sort((a, b) => a.bitrate - b.bitrate);

      const streamUrl = targetStreams[0].url;
      document.getElementById('song-title').innerText = streamData.title;
      document.getElementById('play-status').innerText = "Playing";
      isPlaying = true;
      document.getElementById('play-icon').innerHTML = pauseIcon;

      // Dispatch URL over MQTT
      sendCmd('play', streamUrl);

    } catch (err) {
      alert("Error resolving YouTube stream link.");
      document.getElementById('play-status').innerText = "Error";
    }
  }

  // --- Live Microphone Permission & Recording Handler ---
  async function toggleCall() {
    const callBtn = document.getElementById('call-btn');
    const callText = document.getElementById('call-text');
    const modeBadge = document.getElementById('mode-badge');

    if (!isCalling) {
      try {
        // Request Microphone Access directly from Browser
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
            // Stream chunks as base64 over MQTT
            const reader = new FileReader();
            reader.readAsDataURL(event.data);
            reader.onloadend = () => {
              sendCmd('mic_chunk', reader.result);
            };
          }
        };

        mediaRecorder.start(250); // Slice audio into 250ms chunks for live streaming

        isCalling = true;
        callBtn.classList.add('active');
        callText.innerText = 'End Live Call';
        modeBadge.innerText = 'Live Call Active';
        sendCmd('mode', 'mic');

      } catch (err) {
        alert("Microphone permission was denied or is unsupported.");
        console.error("Mic error:", err);
      }
    } else {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      
      isCalling = false;
      callBtn.classList.remove('active');
      callText.innerText = 'Start Live Mic Call';
      modeBadge.innerText = 'Music Mode';
      sendCmd('mode', 'music');
    }
  }
</script>
</body>
</html>
