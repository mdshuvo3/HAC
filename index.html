<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Dual-Audio Streamer</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    /* ... (Keep your existing CSS exactly as it was) ... */
    :root { --bg: #0f172a; --card-bg: #1e293b; --accent-blue: #2563eb; --accent-purple: #7c3aed; --accent-danger: #dc2626; --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
    .container { background-color: var(--card-bg); width: 100%; max-width: 400px; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444; display: inline-block; margin-right: 6px; }
    .dot.online { background-color: #10b981; }
    .main-controls { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
    .btn-big { width: 100%; padding: 1.2rem; border-radius: 1rem; border: none; font-size: 1.05rem; font-weight: 700; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.75rem; transition: transform 0.1s, opacity 0.2s, background-color 0.2s; }
    .btn-big:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-big:not(:disabled):active { transform: scale(0.98); }
    .btn-system { background-color: var(--accent-blue); }
    .btn-mic { background-color: var(--accent-purple); }
    .btn-big.active { background-color: var(--accent-danger) !important; animation: pulse 1.5s infinite; }
    .exp-section { border-top: 1px solid var(--border); padding-top: 1rem; display: flex; justify-content: flex-end; }
    .btn-small { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 0.4rem 0.8rem; border-radius: 0.5rem; font-size: 0.75rem; cursor: pointer; }
    .btn-small:hover { border-color: var(--text-muted); color: var(--text); }
    .btn-small:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--border); color: var(--text-muted); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; }
    .modal.show { display: flex; }
    .modal-card { background: var(--card-bg); padding: 1.5rem; border-radius: 1rem; width: 90%; max-width: 320px; text-align: left; }
    .modal-card h3 { margin-bottom: 1rem; font-size: 1.1rem; }
    .modal-card input { width: 100%; padding: 0.75rem; margin-bottom: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); background: #0f172a; color: white; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.75; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <div class="status-bar">
    <div><span id="status-dot" class="dot"></span><span id="status-text">ESP32 Offline</span></div>
    <div id="mode-badge" style="font-weight: bold; color: var(--text-muted);">Idle</div>
  </div>

  <div class="main-controls">
    <button id="sys-btn" class="btn-big btn-system" onclick="toggleStream('system')" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span id="sys-text">Stream System Audio</span>
    </button>
    <button id="mic-btn" class="btn-big btn-mic" onclick="toggleStream('mic')" disabled>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      <span id="mic-text">Stream Phone Mic</span>
    </button>
  </div>

  <div class="exp-section">
    <!-- Added ID here to control disabled state -->
    <button id="exp-btn" class="btn-small" onclick="toggleModal(true)" disabled>(Experimental) Update Wi-Fi</button>
  </div>
</div>

<div id="wifi-modal" class="modal">
  <div class="modal-card">
    <h3>Update ESP32 Wi-Fi</h3>
    <input type="text" id="new-ssid" placeholder="New Wi-Fi SSID">
    <input type="password" id="new-pass" placeholder="New Wi-Fi Password">
    <div class="modal-actions">
      <button class="btn-small" onclick="toggleModal(false)">Cancel</button>
      <button class="btn-small" style="background: var(--accent-blue); color: white;" onclick="sendWifiUpdate()">Save & Reboot</button>
    </div>
  </div>
</div>

<script>
  const mqttCmdTopic = "my_client_home_system_1234/command";
  const mqttStatusTopic = "my_client_home_system_1234/status";
  const mqttAudioTopic = "my_client_home_system_1234/audio";

  const options = {
    protocol: 'wss',
    hostname: 'broker.emqx.io', // Using EMQX based on your successful screenshot
    port: 8084,
    path: '/mqtt',
    clientId: 'web_client_' + Math.random().toString(16).substring(2, 8)
  };

  const client = mqtt.connect(options);

  let esp32Online = false;
  let activeMode = null; // Used purely for UI button tracking now
  let audioContext = null;
  let mediaStream = null;
  let scriptProcessor = null;

  client.on('connect', () => {
    client.subscribe(mqttStatusTopic);
    client.publish(mqttCmdTopic, JSON.stringify({ action: "get_status" }));
  });

  client.on('message', (topic, message) => {
    if (topic === mqttStatusTopic) {
      try {
        const data = JSON.parse(message.toString());
        setHardwareState(data.online === true);
      } catch (e) {}
    }
  });

  function setHardwareState(online) {
    esp32Online = online;
    document.getElementById('status-dot').className = `dot ${online ? 'online' : ''}`;
    document.getElementById('status-text').innerText = online ? 'ESP32 Online' : 'ESP32 Offline';
    
    const sysBtn = document.getElementById('sys-btn');
    const micBtn = document.getElementById('mic-btn');
    const expBtn = document.getElementById('exp-btn');

    if (online) {
      sysBtn.removeAttribute('disabled');
      micBtn.removeAttribute('disabled');
      expBtn.removeAttribute('disabled'); // Enable experimental button
    } else {
      sysBtn.setAttribute('disabled', 'true');
      micBtn.setAttribute('disabled', 'true');
      expBtn.setAttribute('disabled', 'true'); // Disable experimental button
      if (activeMode) stopStreaming();
    }
  }

  async function toggleStream(mode) {
    if (!esp32Online) return;

    if (activeMode === mode) {
      stopStreaming();
    } else {
      if (activeMode) stopStreaming();
      await startStreaming(mode);
    }
  }

  async function startStreaming(mode) {
    try {
      if (mode === 'system') {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false }
        });
        if (mediaStream.getAudioTracks().length === 0) {
          mediaStream.getTracks().forEach(t => t.stop());
          return alert("System audio stream failed! Make sure 'Share Audio' is enabled.");
        }
      } else {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true }
        });
      }

      audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 8000 });
      const source = audioContext.createMediaStreamSource(mediaStream);
      scriptProcessor = audioContext.createScriptProcessor(1024, 1, 1);

      scriptProcessor.onaudioprocess = (e) => {
        if (!activeMode) return; // Failsafe
        const inputData = e.inputBuffer.getChannelData(0);
        const pcm16 = new Int16Array(inputData.length);
        for (let i = 0; i < inputData.length; i++) {
          let s = Math.max(-1, Math.min(1, inputData[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        client.publish(mqttAudioTopic, new Uint8Array(pcm16.buffer), { qos: 0 });
      };

      source.connect(scriptProcessor);
      scriptProcessor.connect(audioContext.destination);

      activeMode = mode;
      updateUI();
      // Notice: No longer publishing "mode" to ESP32!

    } catch (err) {
      console.error(err);
      alert("Could not start stream.");
    }
  }

  function stopStreaming() {
    activeMode = null; // Immediately block onaudioprocess
    
    // Aggressively kill the audio pipeline to stop ghost streaming in Wokwi
    if (scriptProcessor) {
      scriptProcessor.onaudioprocess = null;
      scriptProcessor.disconnect();
    }
    if (mediaStream) {
      mediaStream.getTracks().forEach(track => track.stop());
    }
    if (audioContext) {
      audioContext.close();
    }

    updateUI();
  }

  function updateUI() {
    const sysBtn = document.getElementById('sys-btn');
    const micBtn = document.getElementById('mic-btn');
    const badge = document.getElementById('mode-badge');

    sysBtn.classList.remove('active');
    micBtn.classList.remove('active');
    document.getElementById('sys-text').innerText = "Stream System Audio";
    document.getElementById('mic-text').innerText = "Stream Phone Mic";

    if (activeMode === 'system') {
      sysBtn.classList.add('active');
      document.getElementById('sys-text').innerText = "Stop System Stream";
      badge.innerText = "System Mode";
      badge.style.color = "#2563eb";
    } else if (activeMode === 'mic') {
      micBtn.classList.add('active');
      document.getElementById('mic-text').innerText = "Stop Mic Stream";
      badge.innerText = "Mic Mode";
      badge.style.color = "#7c3aed";
    } else {
      badge.innerText = "Idle";
      badge.style.color = "#94a3b8";
    }
  }

  function toggleModal(show) {
    document.getElementById('wifi-modal').classList.toggle('show', show);
  }

  function sendWifiUpdate() {
    const ssid = document.getElementById('new-ssid').value.trim();
    const pass = document.getElementById('new-pass').value.trim();
    if (!ssid) return alert("SSID cannot be empty!");

    if (confirm("Send new Wi-Fi credentials? ESP32 will attempt to reboot and connect.")) {
      client.publish(mqttCmdTopic, JSON.stringify({ action: "update_wifi", ssid: ssid, pass: pass }));
      toggleModal(false);
    }
  }
</script>
</body>
</html>
